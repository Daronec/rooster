# Установщик Windows (MSIX): `dart run msix:create` или `tools/windows/build_msix.ps1`.
# Для подписи вне Store: certificate_path, certificate_password в msix_config.
msix_config:
  display_name: Rooster
  publisher_display_name: ru.aronets
  identity_name: ru.aronets.rooster
  msix_version: 1.0.0.0
  architecture: x64
  capabilities: internetClient
  output_path: dist
  output_name: rooster_installer
  # Логотип пакета (рекомендуется ≥ 400×400 PNG):
  # logo_path: windows/runner/resources/app_icon.png

